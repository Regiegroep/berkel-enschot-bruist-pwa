<!doctype html>
<html lang="nl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berkel-Enschot Bruist</title>

  <meta name="theme-color" content="#C11B5D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bruist">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="app-shell">
    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button type="button" class="nav-item active" data-screen="home">
        <span class="nav-icon" data-icon="home"></span>
        <span>Home</span>
      </button>

      <button type="button" class="nav-item" data-screen="programma">
        <span class="nav-icon" data-icon="calendar"></span>
        <span>Programma</span>
      </button>

      <button type="button" class="nav-item" data-screen="festivalinfo">
        <span class="nav-icon" data-icon="info"></span>
        <span>Festivalinfo</span>
      </button>

      <button type="button" class="nav-item" data-screen="mijn">
        <span class="nav-icon" data-icon="star"></span>
        <span>Mijn Bruist</span>
      </button>

      <button type="button" class="nav-item" data-screen="kaart">
        <span class="nav-icon" data-icon="map"></span>
        <span>Kaart</span>
      </button>
    </nav>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/googleSheets.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      let refreshing = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register("service-worker.js");

          const offerUpdate = (worker) => {
            if (!worker) return;
            const updateNow = window.confirm(
              "Er is een nieuwe versie van Berkel-Enschot Bruist beschikbaar. Nu vernieuwen?"
            );
            if (updateNow) worker.postMessage({ type: "SKIP_WAITING" });
          };

          if (registration.waiting && navigator.serviceWorker.controller) {
            offerUpdate(registration.waiting);
          }

          registration.addEventListener("updatefound", () => {
            const worker = registration.installing;
            if (!worker) return;

            worker.addEventListener("statechange", () => {
              if (
                worker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                offerUpdate(worker);
              }
            });
          });
        } catch (error) {
          console.warn("Service worker kon niet worden geregistreerd:", error);
        }
      });
    }
  </script>

</body>

</html>
